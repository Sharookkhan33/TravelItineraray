<!-- HERO SECTION -->
<section class="hero">
  <div class="hero-content">
    <h1>Welcome to GlobePaths</h1>
    <p>
      Discover breathtaking destinations, handpicked itineraries,
      and unforgettable travel experiences — all in one place.
    </p>

    <!-- 🔑 Anchor Button -->
    <a href="#itineraries" class="explore-btn">
      Explore Packages
    </a>
  </div>

  <div class="hero-slider">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" />
    <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff" />
    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" />
    <img src="https://wallpaperaccess.com/full/2724970.jpg" />
    <img src="https://hikinginsights.com/wp-content/uploads/2023/07/Hikers-on-the-hiking-trail.jpg" />
    <img src="https://wallpaperaccess.com/full/733995.jpg" />
    <img src="https://wallpaperaccess.com/full/678894.jpg" />
    <img src="https://i.pinimg.com/originals/67/6f/af/676faf7518976f1956ac2580726dab69.jpg" />
    <img src="https://cdn.junglelodges.com/uploads/2022/02/6_935x518_acf_cropped.jpg" />

  </div>
</section>

<!-- 🔑 ITINERARY SECTION -->
<section id="itineraries" class="home-container">

  <h1>Discover Amazing Travel Itineraries</h1>
  <p class="subtitle">
    Explore destinations, compare packages, and plan your perfect trip.
  </p>

  <div class="filter">
    <label for="destination">Select Destination:</label>
    <select
      id="destination"
      (change)="onDestinationChange($event)">
      <option value="">All</option>
      <option *ngFor="let d of destinations" [value]="d">
        {{ d }}
      </option>
    </select>
  </div>

  <div class="grid">
    <app-itinerary-card
      *ngFor="let item of filteredItineraries"
      [data]="item">
    </app-itinerary-card>
  </div>

</section>
